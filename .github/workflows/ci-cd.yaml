name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/minisocial-${{ matrix.service }}:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/minisocial-${{ matrix.service }}:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/minisocial-${{ matrix.service }}:latest
        cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure kubeconfig
      run:
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Update image tags in Kubernetes manifests
      run: |
        sed -i "s|image:.*minisocial-backend.*|image: ${{ secrets.DOCKER_USERNAME }}/minisocial-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
        sed -i "s|image:.*minisocial-frontend.*|image: ${{ secrets.DOCKER_USERNAME }}/minisocial-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/postgres-deployment.yaml
        kubectl apply -f k8s/postgres-service.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/backend-service.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/frontend-service.yaml

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/backend-deployment -n minisocial
        kubectl rollout status deployment/frontend-deployment -n minisocial
        kubectl get pods -n minisocial
