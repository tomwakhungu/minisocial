apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: minisocial
data:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: minisocial
  DB_USER: postgres
  PORT: "3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: minisocial
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: tomwakhungu/minisocial-backend:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
